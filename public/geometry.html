<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Panjat Menara Bangun Ruang — Museum Geometri 3D</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/game.css">
  <link rel="stylesheet" href="css/mobile-ui.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%200%2032%2032%22><rect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%232563eb%22/><path d=%22M16%207L25%2012V20L16%2025L7%2020V12L16%207Z%22 fill=%22none%22 stroke=%22%23ffffff%22 stroke-width=%222.4%22 stroke-linejoin=%22round%22/></svg>"><text y=%22.9em%22 font-size=%2290%22></text></svg>">
  <style>
    .geo-clue-banner {
      max-width: 720px;
      margin: 0.45rem auto 0;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1.5px solid rgba(251, 191, 36, 0.55);
      border-radius: 16px;
      padding: 0.65rem 1.25rem;
      text-align: center;
      box-shadow: 0 8px 26px rgba(0, 0, 0, 0.4);
      pointer-events: none;
    }
    .geo-floor-tag {
      font-size: 0.76rem;
      font-weight: 800;
      color: #fbbf24;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .geo-question-text {
      font-size: clamp(0.95rem, 2.2vw, 1.22rem);
      font-weight: 800;
      color: #ffffff;
      margin-top: 0.15rem;
    }
    .level-pill-group {
      display: inline-flex;
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 12px;
      padding: 0.25rem;
      gap: 0.25rem;
    }
    .level-btn {
      border: none;
      background: transparent;
      color: #cbd5e1;
      padding: 0.4rem 0.75rem;
      border-radius: 9px;
      font-weight: 800;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .level-btn.active {
      background: linear-gradient(135deg, #fbbf24, #f97316);
      color: #0f172a;
    }
    #geo-toast {
      position: fixed;
      top: 8.2rem;
      left: 50%;
      transform: translateX(-50%);
      padding: 0.55rem 1.25rem;
      border-radius: 999px;
      font-weight: 800;
      font-size: 0.92rem;
      z-index: 60;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
      box-shadow: 0 8px 22px rgba(0,0,0,0.45);
    }
    .gtoast-ok { background: linear-gradient(135deg, #10b981, #38bdf8); color: #0f172a; }
    .gtoast-fail { background: linear-gradient(135deg, #ef4444, #b91c1c); color: #ffffff; }
  </style>
</head>
<body style="overflow: hidden; touch-action: none;">

  <!-- 3D Geometry Tower Canvas -->
  <div id="game-container">
    <div id="canvas-container"></div>
  </div>

  <!-- Toast Notifikasi -->
  <div id="geo-toast" class="gtoast-ok">Jump-Pad Aktif! Naik Lantai!</div>

  <!-- HUD Layer -->
  <div class="hud-layer">
    <!-- Top Bar -->
    <div class="top-hud-bar">
      <div style="display: flex; gap: 0.5rem; align-items: center;">
        <a href="index.html" class="btn btn-secondary hud-interactive" style="padding: 0.5rem 0.9rem; border-radius: 999px; font-size: 0.85rem;">
          Kota
        </a>
        <div class="hud-badge-box">
          
          <span style="color: #fbbf24; font-size: 0.92rem;">Panjat Menara Bangun Ruang</span>
        </div>
      </div>

      <!-- Mode SD / SMP & Ronde Baru -->
      <div style="display: flex; gap: 0.5rem; align-items: center;" class="hud-interactive">
        <div class="level-pill-group">
          <button id="btn-geo-sd" class="level-btn active">SD</button>
          <button id="btn-geo-smp" class="level-btn">SMP</button>
        </div>
        <button id="btn-geo-reset" class="btn btn-secondary" style="padding: 0.45rem 0.8rem; font-size: 0.8rem;">
          Ronde Baru
        </button>
        <button id="btn-toggle-sound" class="btn btn-secondary" style="padding: 0.45rem 0.75rem; border-radius: 999px;"><svg class="ui-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg></button>
      </div>

      <!-- Lantai Saat Ini -->
      <div class="hud-score-box">
        <span style="font-weight: 800; color: #fbbf24;">Lt.<span id="hud-geo-floor">1</span>/6</span>
      </div>
    </div>

    <!-- Kanan Atas: Peringkat Kelas + Tombol Emot Bulat Dropdown -->
    <div class="geo-right-stack" style="position: absolute; top: 4.8rem; right: 0.8rem; display: flex; flex-direction: column; align-items: flex-end; gap: 0.5rem;">
      <div class="hud-leaderboard hud-interactive" style="position: static;">
        <h4>Peringkat Kelas <span id="geo-player-count">(1)</span></h4>
        <div id="geo-rank-list">
          <div class="rank-item" style="color: var(--text-muted);">Memuat pemanjat...</div>
        </div>
      </div>

      <!-- Tombol Emote Bulat Kecil (Klik ->Memanjang ke Bawah) -->
      <div class="emote-dropdown-wrap">
        <button id="btn-geo-emote-toggle" class="emote-fab-btn" title="Pilih Emote"><svg class="ui-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg></button>
        <div id="geo-emote-menu" class="emote-dropdown-menu">
          <button class="emote-btn geo-emote-btn" data-emote="👋" title="Halo">👋</button>
          <button class="emote-btn geo-emote-btn" data-emote="👍" title="Mantap">👍</button>
          <button class="emote-btn geo-emote-btn" data-emote="🔥" title="Semangat">🔥</button>
          <button class="emote-btn geo-emote-btn" data-emote="💡" title="Ide Cerdas">💡</button>
          <button class="emote-btn geo-emote-btn" data-emote="😂" title="Tertawa">😂</button>
          <button class="emote-btn geo-emote-btn" data-emote="🏆" title="Juara">🏆</button>
        </div>
      </div>
    </div>

    <!-- Bottom Hint PC -->
    <div class="bottom-hud-bar" style="justify-content: flex-end;">
      <div id="pc-controls-hint" style="background: rgba(15,23,42,0.78); padding: 0.45rem 0.85rem; border-radius: 10px; font-size: 0.8rem; color: #cbd5e1;">
        <strong>WASD / Panah</strong>Jalan • <strong>Spasi</strong>Lompat ke Bangun Ruang • <strong>Drag Mouse</strong>Kamera Bebas
      </div>
    </div>
  </div>

  <!-- Analog Kiri Bawah + Tombol Lompat Kanan Bawah (HP & Tablet) -->
  <div class="mobile-controls">
    <div id="mobile-joystick-zone">
      <div id="mobile-joystick-knob"></div>
    </div>
    <div id="mobile-jump-btn">
      <svg class="ui-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg>
      <span>LOMPAT</span>
    </div>
  </div>

  <!-- Finish Podium Modal -->
  <div id="geo-finish-modal" class="podium-overlay" style="display: none;">
    <div class="glass-panel" style="max-width: 600px; width: 92%; padding: 2rem; text-align: center;">
      <h1 style="font-size: 2rem; font-weight: 900; background: linear-gradient(135deg, #fbbf24, #38bdf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
        PUNCAK MENARA GEOMETRI! 
      </h1>
      <p style="color: #cbd5e1; margin: 0.4rem 0 1.2rem;">Kamu berhasil menaklukkan seluruh 6 tingkat bangun ruang 3D!</p>

      <div id="geo-finish-standings" style="background: rgba(15,23,42,0.72); border-radius: 14px; padding: 1rem; margin-bottom: 1.4rem; text-align: left;">
        <!-- Urutan Tercepat -->
      </div>

      <div style="display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap;">
        <button id="btn-geo-play-again" class="btn btn-primary">Panjat Lagi</button>
        <a href="index.html" class="btn btn-secondary">Kembali ke Kota</a>
      </div>
    </div>
  </div>

  <!-- Modular Scripts -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="js/three.min.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/avatar3d.js"></script>
  <script src="js/controls.js"></script>
  <script src="js/mobile-controls.js"></script>
  <script src="js/geometry-main.js"></script>
</body>
</html>
